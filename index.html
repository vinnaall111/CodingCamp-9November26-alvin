<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Balance Card -->
        <header class="balance-card">
            <h1>Expense &amp; Budget Visualizer</h1>
            <p class="balance-label">Total Balance</p>
            <p id="balance" class="balance-value">$0.00</p>
        </header>

        <main class="main-grid">
            <!-- Add Transaction Form -->
            <section class="card form-card">
                <h2 class="card-title">Add Transaction</h2>
                <form id="tx-form">
                    <div class="form-group">
                        <label for="tx-name">Item Name</label>
                        <input type="text" id="tx-name" placeholder="e.g. Lunch" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="tx-amount">Amount</label>
                        <input type="number" id="tx-amount" placeholder="0.00" min="0.01" max="999999999.99" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="tx-category">Category</label>
                        <select id="tx-category"></select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
                <p id="tx-feedback" class="feedback"></p>

                <!-- Custom Category Form -->
                <div class="category-form">
                    <h3 class="subtitle">Add Custom Category</h3>
                    <div class="category-input-row">
                        <input type="text" id="cat-name" placeholder="Category name" maxlength="50">
                        <button type="button" id="cat-add-btn" class="btn btn-secondary">Add</button>
                    </div>
                    <p id="cat-feedback" class="feedback"></p>
                </div>
            </section>

            <!-- Transaction List -->
            <section class="card list-card">
                <div class="list-header">
                    <h2 class="card-title">Transactions</h2>
                    <div class="sort-group">
                        <label for="sort-select">Sort:</label>
                        <select id="sort-select">
                            <option value="amount">Amount (low to high)</option>
                            <option value="category">Category (A-Z)</option>
                        </select>
                    </div>
                </div>
                <div id="tx-list" class="tx-list"></div>
                <p id="tx-empty" class="empty-state">No transactions yet. Add one above!</p>
            </section>

            <!-- Spending Chart -->
            <section class="card chart-card">
                <h2 class="card-title">Spending by Category</h2>
                <div class="chart-wrapper">
                    <canvas id="chart"></canvas>
                    <p id="chart-empty" class="empty-state">No spending data yet</p>
                </div>
            </section>

            <!-- Monthly Summary -->
            <section class="card summary-card">
                <h2 class="card-title">Monthly Summary</h2>
                <div id="month-list" class="month-list"></div>
                <div id="month-detail" class="month-detail"></div>
                <p id="summary-empty" class="empty-state">No transactions to summarize yet.</p>
            </section>
        </main>

        <footer class="footer">
            <p>Your data is saved locally in your browser.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
